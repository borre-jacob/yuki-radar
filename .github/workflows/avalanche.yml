# Fetch the latest Japan Avalanche Network bulletins each morning (Japan time) and
# embed them in index.html. GitHub Pages republishes the app after the commit.
name: Uppdatera lavinprognos

on:
  schedule:
    - cron: "45 21 * * *"   # 06:45 i Japan, efter att JAN publicerat
    - cron: "30 23 * * *"   # 08:30 i Japan, fångar sena prognoser
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Hämta prognoser från JAN
        run: |
          python3 tools/fetch_avalanche.py data/avalanche.json
          python3 tools/inject_avalanche.py index.html data/avalanche.json
      - name: Spara om något ändrats
        run: |
          if git diff --quiet -- data/avalanche.json; then
            echo "Ingen ny prognos."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/avalanche.json index.html
          git commit -m "Uppdatera lavinprognos från JAN"
          git push
